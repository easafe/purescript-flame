name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: purescript-contrib/setup-purescript@v3.1.0
        with:
          purescript: "0.15.17"
          spago: "1.0.5"
          purs-backend-es: "1.4.3"

      - name: Cache PureScript dependencies
        # Caches both the installed packages from the `.spago` directory and
        # compilation artifacts from the `output` directory. When restored the
        # compiler will rebuild any files that have changed.
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('**/spago.yaml', 'spago.lock') }}
          path: |
            .spago
            output

      - run: npm ci
      # Builds the flame and flame-examples workspace packages, and checks
      # that declared dependencies match the imports
      - run: npx spago build --pedantic-packages
      - run: npx spago test
      - run: npm run build-examples
      - name: keyed bench
        working-directory: ./benchmarks/js-framework-benchmark/keyed
        run: spago build
      - name: non-keyed bench
        working-directory: ./benchmarks/js-framework-benchmark/non-keyed
        run: spago build
