package:
  name: flame
  publish:
    version: 1.6.0
    license: MIT
    location:
      githubOwner: easafe
      githubRepo: purescript-flame
  build:
    # Flame.Html.Attribute re-exports whole modules on purpose
    censorProjectWarnings:
      - ImplicitQualifiedImportReExport
  dependencies:
    - aff
    - argonaut-codecs
    - argonaut-core
    - argonaut-generic
    - arrays
    - bifunctors
    - console
    - effect
    - either
    - exceptions
    - foldable-traversable
    - foreign
    - foreign-object
    - maybe
    - nullable
    - partial
    - prelude
    - refs
    - strings
    - tuples
    - typelevel-prelude
    - unsafe-coerce
    - web-dom
    - web-events
  test:
    main: Test.Main
    dependencies:
      - newtype
      - random
      - spec
      - spec-node
      - web-html
      - web-uievents
workspace:
  packageSet:
    registry: 82.1.1
